services:
  # Web Service
  - type: web
    name: imagify-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLIPDROP_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://imagify-ai-generate-3223.netlify.app

  # Static Site for Frontend
  - type: static
    name: imagify-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://imagify-api.onrender.com/api/*
      - type: file
        source: /*
        destination: /index.html
